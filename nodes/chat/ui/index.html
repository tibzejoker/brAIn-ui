<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brAIn Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #111111;
      --elevated: #1A1A1A;
      --border: #262626;
      --border-strong: #333333;
      --text: #EDEDED;
      --text-dim: #A1A1A1;
      --text-muted: #707070;
      --accent: #EDEDED;
      --accent-fg: #0A0A0A;
      --danger: #F84E4E;
      --success: #4ADE80;
      --warning: #FBBF24;
      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 10px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      /* Back-compat aliases used by inline JS. */
      --muted: var(--text-dim);
      --green: var(--success);
      --amber: var(--warning);
      --red: var(--danger);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      font-feature-settings: "cv11", "ss01", "tnum";
      -webkit-font-smoothing: antialiased;
    }
    button {
      background: var(--elevated); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: background 0.1s ease, border-color 0.1s ease;
    }
    button:hover { background: var(--border); border-color: var(--border-strong); }
    button:active { background: var(--border-strong); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.primary:hover { filter: brightness(1.12); }
    button.danger { background: var(--danger); border-color: var(--danger); color: white; }
    button.danger:hover { filter: brightness(1.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, select, textarea {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 10px; font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.1s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }
    code, pre { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1px 6px; font-size: 12px; }
    pre { padding: var(--space-3); overflow-x: auto; }
    hr { border: none; border-top: 1px solid var(--border); margin: var(--space-3) 0; }
    h1, h2, h3 { font-weight: 600; margin: 0 0 var(--space-3); letter-spacing: -0.01em; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--text-dim); }
    .dim { color: var(--text-muted); }

    body { height: 100vh; display: flex; flex-direction: column; }

    .header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 8px; }
    .header h1 { font-size: 14px; font-weight: 600; margin: 0; }
    .header .badge { font-size: 10px; padding: 2px 6px; border-radius: var(--radius-sm); background: var(--elevated); color: var(--text-dim); border: 1px solid var(--border); }
    .header .toggle { margin-left: auto; font-size: 11px; color: var(--text-dim); cursor: pointer; padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; }
    .header .toggle:hover { color: var(--text); border-color: var(--border-strong); background: var(--elevated); }
    .header .toggle.active { background: var(--elevated); color: var(--text); border-color: var(--accent); }

    .main { flex: 1; display: flex; overflow: hidden; }

    /* Chat panel */
    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .messages-inner { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 8px; }
    .msg-row { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
    .msg-row.self { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg { padding: 10px 14px; border-radius: var(--radius-lg); font-size: 13px; line-height: 1.5; word-break: break-word; }
    .msg.self { background: #3b0764; color: #ffffff; border: 1px solid #2e1065; border-bottom-right-radius: var(--radius-sm); }
    .msg.other { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--node-color, var(--border-strong)); border-bottom-left-radius: var(--radius-sm); }
    .msg .meta { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
    .msg.self .meta { color: rgba(255,255,255,0.78); }
    .msg .topic { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
    .msg.self .topic { color: rgba(255,255,255,0.55); }
    .msg .think { font-size: 11px; color: var(--text-dim); background: var(--elevated); border-left: 2px solid var(--warning); padding: 6px 10px; margin: 6px 0; border-radius: var(--radius-sm); font-style: italic; white-space: pre-wrap; }
    .msg .think-label { font-size: 9px; color: var(--warning); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; font-style: italic; }
    .msg .md h1,.msg .md h2,.msg .md h3 { font-size: 14px; font-weight: 700; margin: 8px 0 4px; }
    .msg .md p { margin: 4px 0; }
    .msg .md ul,.msg .md ol { margin: 4px 0; padding-left: 20px; }
    .msg .md li { margin: 2px 0; }
    .msg .md code { background: rgba(255,255,255,0.08); border: 0; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    .msg .md pre { background: rgba(0,0,0,0.35); border: 1px solid var(--border); padding: 8px; border-radius: var(--radius); overflow-x: auto; margin: 6px 0; }
    .msg .md pre code { background: none; border: 0; padding: 0; }
    .msg .md strong { font-weight: 700; }
    .msg .md blockquote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--text-dim); margin: 4px 0; }
    .msg .md hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .actions { display: flex; gap: 4px; padding: 0 4px; }
    .act-btn {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      width: 26px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1; cursor: pointer;
      font-family: inherit; padding: 0;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .act-btn:hover { background: var(--elevated); color: var(--text); border-color: var(--border-strong); }
    .act-btn.speaking { color: var(--warning); border-color: var(--warning); }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-bar { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 8px; max-width: 720px; margin: 0 auto; width: 100%; }
    .input-bar input { flex: 1; padding: 10px 14px; border-radius: var(--radius); background: var(--bg); font-size: 13px; }
    .input-bar button { padding: 10px 20px; border-radius: var(--radius); border: 1px solid #5b21b6; background: #6d28d9; color: #ffffff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .input-bar button:hover { filter: brightness(1.12); }
    .input-bar button:disabled { opacity: 0.45; cursor: default; }

    .config { padding: 6px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--text-dim); max-width: 720px; margin: 0 auto; width: 100%; }
    .config input, .config select { padding: 4px 8px; border-radius: var(--radius-sm); font-size: 11px; }
    .config select { width: 200px; cursor: pointer; }

    /* Bus monitor panel */
    .bus-panel { width: 320px; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
    .bus-panel.hidden { display: none; }
    .bus-header { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
    .bus-header span { font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .bus-events { flex: 1; overflow-y: auto; padding: 4px 0; }
    .bus-event { padding: 4px 12px; font-size: 10px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; }
    .bus-event:hover { background: var(--elevated); }
    .bus-event .ev-time { color: var(--text-muted); }
    .bus-event .ev-topic { font-weight: 600; }
    .bus-event .ev-content { color: var(--text); opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">
    <h1>brAIn Chat</h1>
    <span class="badge" id="status">connecting...</span>
    <button class="toggle active" id="bus-toggle">Bus Monitor</button>
  </div>

  <div class="main">
    <div class="chat">
      <div class="messages" id="messages-scroll">
        <div class="messages-inner" id="messages">
          <div class="empty" id="empty">No messages yet. Type something below.</div>
        </div>
      </div>

      <div class="config">
        <label>Topic:</label>
        <select id="topic"></select>
        <label>Crit:</label>
        <input type="number" id="criticality" value="3" min="0" max="10" style="width:40px">
      </div>

      <div class="input-bar">
        <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>

    <div class="bus-panel" id="bus-panel">
      <div class="bus-header">
        <span>Bus Events</span>
        <span id="bus-count">0</span>
      </div>
      <div class="bus-events" id="bus-events"></div>
    </div>
  </div>

  <script>
    const nodeId = window.location.pathname.split('/nodes/')[1]?.split('/ui')[0];
    const apiBase = window.location.origin;
    let myMessages = new Set();
    const nodeNames = {};
    let ttsNodeId = null;

    async function loadNodeNames() {
      try {
        const res = await fetch(`${apiBase}/network`);
        const data = await res.json();
        for (const n of data.nodes) { nodeNames[n.id] = n.name; }
        // Auto-pick the first running tts node so the 🔊 buttons can route
        // to it. If multiple exist we just take whichever shows up first —
        // the user can refine later if it becomes a need.
        const tts = data.nodes.find(n => n.type === 'tts' && n.state !== 'stopped');
        ttsNodeId = tts?.id ?? null;
      } catch(e) {}
    }

    function nodeName(id) {
      return nodeNames[id] || id.slice(0, 8);
    }

    const $messages = document.getElementById('messages');
    const $empty = document.getElementById('empty');
    const $input = document.getElementById('input');
    const $send = document.getElementById('send');
    const $topic = document.getElementById('topic');
    const $crit = document.getElementById('criticality');
    const $status = document.getElementById('status');
    const $busPanel = document.getElementById('bus-panel');
    const $busEvents = document.getElementById('bus-events');
    const $busCount = document.getElementById('bus-count');
    const $busToggle = document.getElementById('bus-toggle');

    // Toggle bus panel
    $busToggle.addEventListener('click', () => {
      $busPanel.classList.toggle('hidden');
      $busToggle.classList.toggle('active');
    });

    // Send message
    async function sendMessage() {
      const content = $input.value.trim();
      if (!content) return;
      $send.disabled = true;
      try {
        const res = await fetch(`${apiBase}/nodes/${nodeId}/ui/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: $topic.value || 'chat.input',
            content,
            criticality: parseInt($crit.value) || 3,
            // Tag with platform=web so messenger bridges (telegram, whatsapp,
            // discord) can prefix the mirrored message with [web · you] —
            // same consistency the cross-bridge case already gets.
            metadata: { platform: 'web', sender: 'you' },
          }),
        });
        const data = await res.json();
        myMessages.add(data.message_id);
        $input.value = '';
        pollMessages();
      } catch (e) { /* send failed */ }
      $send.disabled = false;
      $input.focus();
    }

    $send.addEventListener('click', sendMessage);
    $input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    // Delegated handler for per-message copy / speak actions.
    $messages.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('.act-btn');
      if (!btn) return;
      const row = btn.closest('.msg-row');
      const text = row?.dataset.speakable || '';
      if (!text) return;

      if (btn.dataset.action === 'copy') {
        try {
          await navigator.clipboard.writeText(text);
          const orig = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => { btn.textContent = orig; }, 1000);
        } catch (e) { /* clipboard blocked */ }
        return;
      }

      if (btn.dataset.action === 'speak') {
        if (!ttsNodeId) {
          // Refresh once in case the tts node was spawned after page load.
          await loadNodeNames();
        }
        if (!ttsNodeId) {
          const orig = btn.textContent;
          btn.textContent = '✗';
          btn.title = 'No tts node running';
          setTimeout(() => { btn.textContent = orig; btn.title = 'Read aloud (tts)'; }, 2000);
          return;
        }
        btn.classList.add('speaking');
        try {
          // Strip markdown so the synthesizer doesn't read "asterisk asterisk".
          const plain = text
            .replace(/```[\s\S]*?```/g, '')
            .replace(/`([^`]+)`/g, '$1')
            .replace(/[*_~]+/g, '')
            .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
            .replace(/^>\s?/gm, '')
            .replace(/^#+\s+/gm, '')
            .trim();
          await fetch(`${apiBase}/nodes/${ttsNodeId}/ui/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              topic: 'tts.speak',
              content: plain,
              criticality: 4,
              from: 'system.chat-ui',
            }),
          });
        } catch (e) { /* ignore */ }
        setTimeout(() => { btn.classList.remove('speaking'); }, 1500);
      }
    });

    // Poll chat messages
    async function pollMessages() {
      try {
        const res = await fetch(`${apiBase}/nodes/${nodeId}/ui/messages`);
        const messages = await res.json();
        // Always re-render — renderMessages dedups via existingIds, so this
        // is cheap. The old `length !== lastCount` short-circuit broke once
        // the bus reached the 50-message cap (length stays at 50, new
        // messages get rotated in but the count condition stays equal —
        // freshly typed messages stopped appearing until a full refresh).
        renderMessages(messages);
        $status.textContent = `${messages.length} msgs`;
        $status.style.background = 'var(--elevated)';
        $status.style.color = 'var(--success)';
      } catch (e) {
        $status.textContent = 'disconnected';
        $status.style.background = 'var(--elevated)';
        $status.style.color = 'var(--danger)';
      }
    }

    function renderMessages(messages) {
      if (messages.length === 0) { $empty.style.display = 'flex'; return; }
      $empty.style.display = 'none';
      // Capture BEFORE appending so the scrollHeight reflects the
      // pre-render state. Auto-stick to bottom only when the user was
      // already near it — otherwise we'd yank them back every poll
      // while they're scrolled up reading history.
      const scrollEl = document.getElementById('messages-scroll');
      const STICK_THRESHOLD_PX = 80;
      const wasNearBottom = scrollEl
        ? (scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight) < STICK_THRESHOLD_PX
        : true;
      const existing = $messages.querySelectorAll('.msg-row');
      const existingIds = new Set(Array.from(existing).map(el => el.dataset.id));
      // Any of the newly-rendered rows belong to the local user? If so
      // we force a scroll-to-bottom regardless of where the viewport
      // sits — they expect to see their own message land.
      let addedSelfMessage = false;
      for (const msg of messages) {
        if (existingIds.has(msg.id)) continue;
        const isSelf = msg.from === nodeId || myMessages.has(msg.id);
        if (isSelf) addedSelfMessage = true;
        const time = new Date(msg.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const payload = msg.payload || {};
        const rawContent = payload.content || payload.title || JSON.stringify(payload);
        const { thinking, reply } = parseThinking(rawContent);
        const sender = msg.from === nodeId ? 'you' : nodeName(msg.from);
        const senderColor = isSelf ? 'inherit' : `hsl(${topicHue(sender)}, 70%, 65%)`;

        const row = document.createElement('div');
        row.className = `msg-row ${isSelf ? 'self' : 'other'}`;
        row.dataset.id = msg.id;
        if (reply) row.dataset.speakable = reply;

        const bubble = document.createElement('div');
        bubble.className = `msg ${isSelf ? 'self' : 'other'}`;
        if (!isSelf) bubble.style.setProperty('--node-color', senderColor);
        let html = `<div class="meta">${time} · <span style="color:${senderColor};font-weight:600">${sender}</span></div>`;
        if (thinking) html += `<div class="think"><div class="think-label">thinking</div>${escapeHtml(thinking)}</div>`;
        if (reply) html += `<div class="md">${isSelf ? escapeHtml(reply) : marked.parse(reply)}</div>`;
        html += `<div class="topic">${msg.topic}</div>`;
        bubble.innerHTML = html;
        row.appendChild(bubble);

        // Action row sits BELOW the bubble. Always visible — icons only,
        // tooltip via title. Speakable text is stashed on the row so the
        // delegated click handler doesn't have to re-extract from the DOM.
        if (reply) {
          const actions = document.createElement('div');
          actions.className = 'actions';
          actions.innerHTML = `
            <button class="act-btn" data-action="copy" title="Copy text" aria-label="Copy">⎘</button>
            <button class="act-btn" data-action="speak" title="Read aloud (tts)" aria-label="Speak">🔊</button>
          `;
          row.appendChild(actions);
        }

        $messages.appendChild(row);
      }
      if ((wasNearBottom || addedSelfMessage) && scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
    }

    // Poll ALL bus messages for the monitor
    async function pollBus() {
      if ($busPanel.classList.contains('hidden')) return;
      try {
        const res = await fetch(`${apiBase}/network/messages?last=50`);
        const msgs = await res.json();
        // Same caveat as pollMessages — once the bus hits the 50-message
        // cap the count stops changing, so a count guard would freeze the
        // monitor. renderBusEvents is a full replace anyway, cheap enough.
        renderBusEvents(msgs);
      } catch (e) { /* silent */ }
    }

    function topicHue(topic) {
      let h = 0;
      for (let i = 0; i < topic.length; i++) h = topic.charCodeAt(i) + ((h << 5) - h);
      return Math.abs(h) % 360;
    }

    function renderBusEvents(msgs) {
      $busEvents.innerHTML = '';
      $busCount.textContent = String(msgs.length);
      for (const msg of msgs) {
        const el = document.createElement('div');
        el.className = 'bus-event';
        const t = new Date(msg.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const hue = topicHue(msg.topic);
        const p = msg.payload || {};
        const preview = (p.content || p.title || '').slice(0, 60);
        el.innerHTML = `
          <div><span class="ev-time">${t}</span> <span class="ev-topic" style="color:hsl(${hue},70%,65%)">${msg.topic}</span> <span class="ev-time">${nodeName(msg.from)}</span></div>
          <div class="ev-content">${escapeHtml(preview)}</div>
        `;
        $busEvents.appendChild(el);
      }
      $busEvents.scrollTop = $busEvents.scrollHeight;
    }

    function parseThinking(text) {
      const thinkPattern = /\{"tool"\s*:\s*"think"\s*,\s*"args"\s*:\s*(\{[^}]*\}|"[^"]*")\}/g;
      let thinking = '';
      let remaining = text;
      let match;
      while ((match = thinkPattern.exec(text)) !== null) {
        let thought = match[1];
        if (thought.startsWith('"') && thought.endsWith('"')) {
          thought = thought.slice(1, -1);
        } else {
          try { const p = JSON.parse(thought); thought = p.thought || p.content || JSON.stringify(p); } catch(e) {}
        }
        thinking += (thinking ? '\n' : '') + thought.replace(/\\n/g, '\n').replace(/\\"/g, '"');
        remaining = remaining.replace(match[0], '');
      }
      return { thinking: thinking || null, reply: remaining.trim() || null };
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Fetch available topics from network
    async function loadTopics() {
      try {
        const res = await fetch(`${apiBase}/network`);
        const data = await res.json();
        const topics = new Set();

        // Collect all subscription patterns (= input topics of nodes)
        for (const node of data.nodes) {
          for (const sub of node.subscriptions) {
            topics.add(sub.pattern);
          }
        }

        // Also get default_publishes from types
        try {
          const typesRes = await fetch(`${apiBase}/types`);
          const types = await typesRes.json();
          for (const t of types) {
            if (t.default_publishes) {
              for (const p of t.default_publishes) topics.add(p);
            }
          }
        } catch(e) {}

        // Sort and populate dropdown
        const sorted = Array.from(topics).sort();
        $topic.innerHTML = '';
        for (const t of sorted) {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          if (t === 'chat.input') opt.selected = true;
          $topic.appendChild(opt);
        }
      } catch(e) {}
    }

    // Start polling
    loadNodeNames();
    setInterval(loadNodeNames, 10000);
    loadTopics();
    setInterval(pollMessages, 1000);
    setInterval(pollBus, 1500);
    pollMessages();
    pollBus();
    $input.focus();

    if (window.parent !== window) {
      window.parent.postMessage({ type: 'brain-node-ui-ready', nodeId }, '*');
    }
  </script>
</body>
</html>
